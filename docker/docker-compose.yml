# Runs the whole system: database, backend, frontend.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Then open http://localhost:3000
#
# The database name, user and password below are demo values. To use your own, put
# POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD in a docker/.env file (see .env.example).

name: scheduler

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scheduler}
      DB_USERNAME: ${POSTGRES_USER:-scheduler}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # The web server only answers once Flyway and Quartz have finished starting.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/tasks"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
